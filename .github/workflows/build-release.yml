name: Build Signed Release APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'       # GitHub release: v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-play'  # Play Store release: v1.0.0-play
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          # Remove unnecessary files
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af

          echo "Disk space after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version and build type from tag
        id: version
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}           # Remove 'v' prefix
          VERSION=${VERSION%-play}   # Remove '-play' suffix if present
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Play Store builds don't get the update checker
          if [[ "$TAG" == *-play ]]; then
            echo "github_release=false" >> $GITHUB_OUTPUT
            echo "Building Play Store version: $VERSION"
          else
            echo "github_release=true" >> $GITHUB_OUTPUT
            echo "Building GitHub version: $VERSION"
          fi

      # Runs before the build on purpose: a missing entry fails in seconds rather
      # than after a ~25 minute build that would then publish with the wrong notes.
      - name: Extract changelog entry for this version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # The "## vX.Y.Z" section, up to the next "## " heading, with surrounding
          # blank lines trimmed. All in awk so it stays portable and locally testable.
          # A -play tag reuses the same section, since -play was already stripped above.
          awk -v want="## v$VERSION" '
            $0 == want { inside = 1; next }
            inside && /^## / { exit }
            inside { lines[n++] = $0 }
            END {
              first = 0; last = n - 1
              while (first < n   && lines[first] ~ /^[[:space:]]*$/) first++
              while (last >= first && lines[last]  ~ /^[[:space:]]*$/) last--
              for (i = first; i <= last; i++) print lines[i]
            }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error file=CHANGELOG.md::No '## v$VERSION' section found in CHANGELOG.md. Add one and re-tag."
            exit 1
          fi

          echo "Release notes for v$VERSION:"
          cat release-notes.md

      - name: Build signed release APK
        env:
          GIT_REPO: ${{ github.server_url }}/${{ github.repository }}.git
          GIT_BRANCH: ${{ github.ref_name }}
          BUILD_TYPE: release
          APP_VERSION: ${{ steps.version.outputs.version }}
          GITHUB_RELEASE: ${{ steps.version.outputs.github_release }}
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./docker-build.sh
          ./docker-build.sh build

      # The build emits app-<abi>-release.apk per ABI plus app-universal-release.apk.
      # docker-build.sh reports success even when the inner build failed, so a
      # missing APK has to fail here rather than publish a partial release.
      - name: Rename APKs with version
        run: |
          VERSION=${{ github.ref_name }}
          for variant in universal arm64-v8a armeabi-v7a x86 x86_64; do
            src="build-output/app-${variant}-release.apk"
            if [ ! -f "$src" ]; then
              echo "::error::Missing $src"
              ls -l build-output/
              exit 1
            fi
            sudo mv "$src" "build-output/librisync-${VERSION}-${variant}.apk"
          done
          ls -lh build-output/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: librisync-${{ github.ref_name }}
          path: build-output/librisync-*.apk
          retention-days: 30

      - name: Add APK guide to release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat >> release-notes.md <<'EOF'

          ### Which APK?

          Most phones want **`arm64-v8a`**. If unsure, take **`universal`** — it runs
          everywhere but is ~200 MB against ~60 MB. `armeabi-v7a` is for older
          32-bit phones; `x86` / `x86_64` are for emulators and Chromebooks.
          EOF

      # Only the universal APK goes up with the release; the per-ABI ones follow
      # in the next step. Builds up to v0.0.30 take the first .apk asset as their
      # update, so the universal one must be uploaded first.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: build-output/librisync-*-universal.apk
          # body is pre-pended to the auto-generated notes, so the release reads
          # as the user-facing changelog first, then the commit list + compare link.
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload per-ABI APKs
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${{ github.ref_name }}
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            gh release upload "$VERSION" "build-output/librisync-${VERSION}-${abi}.apk" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
