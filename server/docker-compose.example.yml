# Example deployment. Copy to docker-compose.yml and adjust the paths, then
# `docker compose up -d --build`. No prebuilt image is published: the image is built
# from this repository (the build context is the repository root, one level up).
#
# /config holds the database with your store credentials — treat it as a secret and
# back it up. /audiobooks is where finished books land; point Audiobookshelf's library
# at the same folder.
services:
  librisync:
    image: librisync-server
    build:
      context: ..
      dockerfile: server/Dockerfile
    container_name: librisync
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - /path/to/audiobooks:/audiobooks
    ports:
      - "8383:8383"
    restart: unless-stopped
